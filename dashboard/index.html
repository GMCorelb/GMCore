<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GMCore — Bookings Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0F2442;
    --navy-mid: #1A3A6B;
    --accent: #2E8FE3;
    --accent-bright: #4EABF5;
    --success: #2ECC71;
    --warning: #F6C90E;
    --danger: #E74C3C;
    --slate: #4A5568;
    --slate-light: #718096;
    --border: #E2E8F0;
    --off-white: #F7F9FC;
    --white: #fff;
    --shadow: 0 4px 24px rgba(15,36,66,0.10);
    --shadow-lg: 0 12px 48px rgba(15,36,66,0.16);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; }
  body { font-family: 'DM Sans', sans-serif; background: var(--off-white); color: var(--navy); min-height: 100vh; }

  /* HEADER */
  header {
    background: var(--navy);
    padding: 0 2rem;
    height: 64px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 2px 16px rgba(15,36,66,0.3);
    position: sticky; top: 0; z-index: 100;
  }
  .header-logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.2rem; font-weight: 700;
    color: #fff;
    text-shadow: 0 0 8px #fff, 0 0 20px #228dff, 0 0 40px #228dff;
    animation: flicker 1.5s infinite alternate;
    text-decoration: none;
  }
  @keyframes flicker {
    0%,100%{opacity:1} 42%{opacity:0.82} 43%{opacity:1} 45%{opacity:0.72} 45.1%{opacity:1}
  }
  .header-right { display: flex; align-items: center; gap: 1rem; }
  .header-tag {
    background: rgba(46,143,227,0.2); color: var(--accent-bright);
    padding: 0.3rem 0.9rem; border-radius: 50px;
    font-size: 0.78rem; font-weight: 600; letter-spacing: 0.08em;
  }
  .sync-btn {
    background: rgba(255,255,255,0.1); color: white;
    border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
    padding: 0.4rem 1rem; font-size: 0.82rem; font-weight: 500;
    cursor: pointer; font-family: 'DM Sans', sans-serif;
    transition: background 0.2s;
    display: flex; align-items: center; gap: 6px;
  }
  .sync-btn:hover { background: rgba(255,255,255,0.18); }
  .sync-btn.spinning .sync-icon { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sync-icon { display: inline-block; }

  /* LAYOUT */
  .main { max-width: 1300px; margin: 0 auto; padding: 2rem; }

  /* STATS ROW */
  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2rem; }
  .stat-card {
    background: white; border-radius: 14px; padding: 1.2rem 1.5rem;
    border: 1px solid var(--border); box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 1rem;
  }
  .stat-icon { font-size: 1.8rem; }
  .stat-num { font-size: 1.8rem; font-weight: 700; color: var(--navy); line-height: 1; }
  .stat-label { font-size: 0.78rem; color: var(--slate-light); margin-top: 2px; }

  /* GRID: calendar + sidebar */
  .content-grid { display: grid; grid-template-columns: 1fr 340px; gap: 1.5rem; align-items: start; }

  /* CALENDAR */
  .calendar-card {
    background: white; border-radius: 18px; border: 1px solid var(--border);
    box-shadow: var(--shadow); overflow: hidden;
  }
  .cal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.2rem 1.5rem; border-bottom: 1px solid var(--border);
    background: var(--navy);
  }
  .cal-nav-btn {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    color: white; width: 36px; height: 36px; border-radius: 8px;
    cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .cal-nav-btn:hover { background: rgba(255,255,255,0.2); }
  .cal-month-label { font-size: 1.1rem; font-weight: 700; color: white; }
  .cal-weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr);
    background: var(--off-white); border-bottom: 1px solid var(--border);
  }
  .cal-weekday {
    text-align: center; padding: 0.6rem; font-size: 0.72rem; font-weight: 700;
    color: var(--slate-light); text-transform: uppercase; letter-spacing: 0.05em;
  }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
  .cal-day {
    min-height: 90px; padding: 0.5rem;
    border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
    cursor: pointer; transition: background 0.15s; position: relative;
  }
  .cal-day:nth-child(7n) { border-right: none; }
  .cal-day:hover { background: var(--off-white); }
  .cal-day.other-month { background: #fafbfc; }
  .cal-day.other-month .day-num { color: #ccd; }
  .cal-day.today { background: rgba(46,143,227,0.06); }
  .cal-day.today .day-num {
    background: var(--accent); color: white;
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .cal-day.selected { background: rgba(46,143,227,0.1); outline: 2px solid var(--accent); outline-offset: -2px; }
  .day-num { font-size: 0.82rem; font-weight: 600; color: var(--navy); margin-bottom: 4px; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; }
  .day-bookings { display: flex; flex-direction: column; gap: 2px; }
  .day-booking-pill {
    font-size: 0.65rem; font-weight: 600; padding: 2px 5px;
    border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    cursor: pointer;
  }
  .pill-morning { background: rgba(46,143,227,0.15); color: #1A6DB5; }
  .pill-afternoon { background: rgba(212,168,83,0.2); color: #8B6914; }
  .pill-evening { background: rgba(46,204,113,0.15); color: #1A7A46; }
  .pill-tbd { background: rgba(74,85,104,0.1); color: var(--slate); }
  .more-badge { font-size: 0.62rem; color: var(--slate-light); padding-left: 2px; }

  /* SIDEBAR */
  .sidebar { display: flex; flex-direction: column; gap: 1rem; }

  .day-detail-card {
    background: white; border-radius: 18px; border: 1px solid var(--border);
    box-shadow: var(--shadow); overflow: hidden;
  }
  .day-detail-header {
    background: var(--navy); padding: 1rem 1.5rem;
    display: flex; justify-content: space-between; align-items: center;
  }
  .day-detail-header h3 { color: white; font-size: 0.95rem; }
  .booking-count-badge {
    background: var(--accent); color: white;
    font-size: 0.75rem; font-weight: 700;
    padding: 2px 9px; border-radius: 50px;
  }
  .day-detail-body { padding: 1rem; max-height: 420px; overflow-y: auto; }
  .no-bookings {
    text-align: center; padding: 2rem 1rem; color: var(--slate-light); font-size: 0.9rem;
  }
  .no-bookings-icon { font-size: 2rem; display: block; margin-bottom: 0.5rem; }

  .booking-item {
    border: 1px solid var(--border); border-radius: 12px; padding: 1rem;
    margin-bottom: 0.8rem; transition: box-shadow 0.15s; cursor: pointer;
  }
  .booking-item:last-child { margin-bottom: 0; }
  .booking-item:hover { box-shadow: var(--shadow); }
  .booking-item-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; }
  .booking-name { font-weight: 700; font-size: 0.95rem; }
  .time-badge {
    font-size: 0.7rem; font-weight: 600; padding: 2px 8px; border-radius: 50px;
    white-space: nowrap;
  }
  .booking-detail { font-size: 0.8rem; color: var(--slate); line-height: 1.6; }
  .booking-detail span { display: flex; align-items: flex-start; gap: 5px; }
  .booking-service-tag {
    display: inline-block; margin-top: 0.4rem;
    background: rgba(46,143,227,0.1); color: var(--accent);
    font-size: 0.72rem; font-weight: 600; padding: 2px 8px; border-radius: 4px;
  }
  .booking-actions { display: flex; gap: 0.5rem; margin-top: 0.7rem; }
  .action-btn {
    flex: 1; padding: 0.4rem; border-radius: 8px; font-size: 0.75rem; font-weight: 600;
    cursor: pointer; border: none; font-family: 'DM Sans', sans-serif; transition: opacity 0.15s;
  }
  .action-btn:hover { opacity: 0.85; }
  .action-wa { background: #25D366; color: white; }
  .action-call { background: var(--accent); color: white; }

  /* ALL BOOKINGS LIST */
  .all-bookings-card {
    background: white; border-radius: 18px; border: 1px solid var(--border);
    box-shadow: var(--shadow); overflow: hidden;
  }
  .all-bookings-header {
    background: var(--off-white); border-bottom: 1px solid var(--border);
    padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center;
  }
  .all-bookings-header h3 { font-size: 0.95rem; font-weight: 700; color: var(--navy); }
  .all-bookings-body { max-height: 300px; overflow-y: auto; }
  .list-item {
    display: flex; align-items: center; gap: 0.8rem;
    padding: 0.8rem 1.2rem; border-bottom: 1px solid var(--border);
    cursor: pointer; transition: background 0.15s;
  }
  .list-item:last-child { border-bottom: none; }
  .list-item:hover { background: var(--off-white); }
  .list-avatar {
    width: 34px; height: 34px; border-radius: 50%; background: var(--navy);
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 700; font-size: 0.85rem; flex-shrink: 0;
  }
  .list-name { font-weight: 600; font-size: 0.88rem; }
  .list-meta { font-size: 0.75rem; color: var(--slate-light); }
  .list-date { margin-left: auto; font-size: 0.75rem; font-weight: 600; color: var(--accent); white-space: nowrap; }

  /* MODAL */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(15,36,66,0.6);
    z-index: 999; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: white; border-radius: 20px; padding: 2rem;
    width: 90%; max-width: 480px; box-shadow: var(--shadow-lg);
    position: relative; animation: modalIn 0.2s ease;
  }
  @keyframes modalIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:none} }
  .modal-close {
    position: absolute; top: 1rem; right: 1rem;
    background: var(--off-white); border: none; border-radius: 50%;
    width: 32px; height: 32px; cursor: pointer; font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
  }
  .modal h2 { font-size: 1.3rem; margin-bottom: 1.2rem; }
  .modal-row { display: flex; gap: 0.5rem; align-items: flex-start; margin-bottom: 0.7rem; font-size: 0.9rem; }
  .modal-label { font-weight: 600; min-width: 90px; color: var(--slate); }
  .modal-value { color: var(--navy); }
  .modal-actions { display: flex; gap: 0.8rem; margin-top: 1.5rem; }
  .modal-btn {
    flex: 1; padding: 0.7rem; border-radius: 50px; font-size: 0.9rem;
    font-weight: 700; cursor: pointer; border: none; font-family: 'DM Sans', sans-serif;
    transition: opacity 0.15s;
  }
  .modal-btn:hover { opacity: 0.88; }
  .modal-wa { background: #25D366; color: white; }
  .modal-call { background: var(--accent); color: white; }

  /* LOADING */
  .loading-state { text-align: center; padding: 3rem; color: var(--slate-light); }
  .spinner {
    width: 36px; height: 36px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 1rem;
  }

  /* EMPTY STATE */
  .empty-state { text-align: center; padding: 4rem 2rem; color: var(--slate-light); }
  .empty-icon { font-size: 3rem; display: block; margin-bottom: 1rem; }

  /* RESPONSIVE */
  @media (max-width: 960px) {
    .content-grid { grid-template-columns: 1fr; }
    .stats-row { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 500px) {
    .stats-row { grid-template-columns: 1fr 1fr; }
    .main { padding: 1rem; }
    .cal-day { min-height: 60px; }
  }
</style>
</head>
<body>

<header>
  <a class="header-logo" href="gmcore.html">GMC<span style="text-transform:none">ore</span></a>
  <div class="header-right">
    <span class="header-tag">📅 Bookings Dashboard</span>
    <button class="sync-btn" id="syncBtn" onclick="loadBookings()">
      <span class="sync-icon">🔄</span> Refresh
    </button>
  </div>
</header>

<div class="main">

  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-icon">📋</div>
      <div><div class="stat-num" id="statTotal">—</div><div class="stat-label">Total Bookings</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">📅</div>
      <div><div class="stat-num" id="statToday">—</div><div class="stat-label">Today</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">🔜</div>
      <div><div class="stat-num" id="statUpcoming">—</div><div class="stat-label">Upcoming (7 days)</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">❓</div>
      <div><div class="stat-num" id="statTbd">—</div><div class="stat-label">Date TBD</div></div>
    </div>
  </div>

  <div class="content-grid">

    <!-- CALENDAR -->
    <div>
      <div class="calendar-card">
        <div class="cal-header">
          <button class="cal-nav-btn" onclick="changeMonth(-1)">‹</button>
          <span class="cal-month-label" id="calMonthLabel"></span>
          <button class="cal-nav-btn" onclick="changeMonth(1)">›</button>
        </div>
        <div class="cal-weekdays">
          <div class="cal-weekday">Sun</div><div class="cal-weekday">Mon</div>
          <div class="cal-weekday">Tue</div><div class="cal-weekday">Wed</div>
          <div class="cal-weekday">Thu</div><div class="cal-weekday">Fri</div>
          <div class="cal-weekday">Sat</div>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>

      <!-- ALL BOOKINGS LIST -->
      <div class="all-bookings-card" style="margin-top:1.5rem">
        <div class="all-bookings-header">
          <h3>All Bookings (newest first)</h3>
          <span id="listCount" style="font-size:0.8rem;color:var(--slate-light)"></span>
        </div>
        <div class="all-bookings-body" id="allBookingsList">
          <div class="loading-state"><div class="spinner"></div>Loading…</div>
        </div>
      </div>
    </div>

    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="day-detail-card">
        <div class="day-detail-header">
          <h3 id="dayDetailTitle">Select a day</h3>
          <span class="booking-count-badge" id="dayDetailCount">0</span>
        </div>
        <div class="day-detail-body" id="dayDetailBody">
          <div class="no-bookings">
            <span class="no-bookings-icon">📆</span>
            Click any day on the calendar to see bookings for that date.
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- BOOKING DETAIL MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <button class="modal-close" onclick="document.getElementById('modalOverlay').classList.remove('open')">✕</button>
    <h2 id="modalName"></h2>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button class="modal-btn modal-wa" id="modalWa">💬 WhatsApp</button>
      <button class="modal-btn modal-call" id="modalCall">📞 Call</button>
    </div>
  </div>
</div>

<script>
  // ── STATE ──
  let allBookings = [];
  let currentYear = new Date().getFullYear();
  let currentMonth = new Date().getMonth(); // 0-indexed
  let selectedDate = null;

  // ── FORMSPREE LOAD ──
  async function loadBookings() {
    const btn = document.getElementById('syncBtn');
    btn.classList.add('spinning');

    try {
      // Formspree submissions API — requires the form token
      const res = await fetch('https://formspree.io/api/0/forms/maqllyeb/submissions', {
        headers: { 'Accept': 'application/json' }
      });

      if (!res.ok) throw new Error('API error');
      const data = await res.json();
      const submissions = data.submissions || [];

      allBookings = submissions.map(s => ({
        id: s._id || Math.random().toString(36),
        name:     s.name     || s._replyto_name || '(No name)',
        phone:    s.phone    || '',
        service:  s.service  || '',
        location: s.location || '',
        date:     s.date     || '',
        time:     s.time     || '',
        problem:  s.problem  || '',
        submittedAt: s._date || ''
      }));

    } catch(e) {
      // If API not accessible (CORS/auth), fall back to localStorage demo data
      const stored = localStorage.getItem('gmcore_bookings');
      if (stored) {
        allBookings = JSON.parse(stored);
      } else {
        allBookings = getSampleData();
      }
    }

    btn.classList.remove('spinning');
    renderAll();
  }

  // ── SAMPLE DATA (shown until real bookings arrive) ──
  function getSampleData() {
    const today = new Date();
    const fmt = (d) => d.toISOString().split('T')[0];
    const addDays = (n) => { const d = new Date(today); d.setDate(d.getDate()+n); return fmt(d); };
    return [
      { id:'1', name:'Sara Mansour',   phone:'96170111111', service:'Convenience Premium – On-Site Visit ($20–$35)', location:'Tripoli', date:addDays(1),  time:'Morning (9am–12pm)',    problem:'Virus popup keeps appearing', submittedAt: new Date().toISOString() },
      { id:'2', name:'Hana Khalil',    phone:'96170222222', service:'Senior Care Package ($30–$40)',                  location:'Zgharta', date:addDays(2),  time:'Afternoon (12pm–4pm)',  problem:'Lost all photos on tablet', submittedAt: new Date().toISOString() },
      { id:'3', name:'Karim Rahhal',   phone:'96170333333', service:'Base Fix – Software ($15–$25)',                  location:'Beirut',  date:addDays(2),  time:'Morning (9am–12pm)',    problem:'Laptop very slow to start',  submittedAt: new Date().toISOString() },
      { id:'4', name:'Rima Abi Nader', phone:'96170444444', service:'Convenience Premium – On-Site Visit ($20–$35)', location:'Byblos',  date:addDays(5),  time:'Evening (4pm–7pm)',     problem:'Screen cracked, need quote', submittedAt: new Date().toISOString() },
      { id:'5', name:'Joseph Tanios',  phone:'96170555555', service:'Base Fix – Software ($15–$25)',                  location:'Tripoli', date:'',          time:'',                      problem:'Not sure what plan I need', submittedAt: new Date().toISOString() },
    ];
  }

  // ── RENDER ALL ──
  function renderAll() {
    updateStats();
    renderCalendar();
    renderAllList();
    if (selectedDate) showDayDetail(selectedDate);
  }

  // ── STATS ──
  function updateStats() {
    const todayStr = new Date().toISOString().split('T')[0];
    const in7 = new Date(); in7.setDate(in7.getDate()+7);
    const in7Str = in7.toISOString().split('T')[0];

    document.getElementById('statTotal').textContent    = allBookings.length;
    document.getElementById('statToday').textContent    = allBookings.filter(b => b.date === todayStr).length;
    document.getElementById('statUpcoming').textContent = allBookings.filter(b => b.date > todayStr && b.date <= in7Str).length;
    document.getElementById('statTbd').textContent      = allBookings.filter(b => !b.date).length;
  }

  // ── CALENDAR ──
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function changeMonth(dir) {
    currentMonth += dir;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    if (currentMonth < 0)  { currentMonth = 11; currentYear--; }
    renderCalendar();
  }

  function renderCalendar() {
    document.getElementById('calMonthLabel').textContent = `${MONTHS[currentMonth]} ${currentYear}`;
    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';

    const firstDay = new Date(currentYear, currentMonth, 1).getDay();
    const daysInMonth = new Date(currentYear, currentMonth+1, 0).getDate();
    const daysInPrev  = new Date(currentYear, currentMonth, 0).getDate();
    const todayStr = new Date().toISOString().split('T')[0];

    // Index bookings by date
    const byDate = {};
    allBookings.forEach(b => {
      if (b.date) {
        if (!byDate[b.date]) byDate[b.date] = [];
        byDate[b.date].push(b);
      }
    });

    const totalCells = Math.ceil((firstDay + daysInMonth) / 7) * 7;

    for (let i = 0; i < totalCells; i++) {
      const cell = document.createElement('div');
      cell.className = 'cal-day';

      let dateStr, dayNum, isOther = false;

      if (i < firstDay) {
        dayNum = daysInPrev - firstDay + i + 1;
        const m = currentMonth === 0 ? 12 : currentMonth;
        const y = currentMonth === 0 ? currentYear-1 : currentYear;
        dateStr = `${y}-${String(m).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
        isOther = true;
      } else if (i >= firstDay + daysInMonth) {
        dayNum = i - firstDay - daysInMonth + 1;
        const m = currentMonth === 11 ? 1 : currentMonth+2;
        const y = currentMonth === 11 ? currentYear+1 : currentYear;
        dateStr = `${y}-${String(m).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
        isOther = true;
      } else {
        dayNum = i - firstDay + 1;
        dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
      }

      if (isOther) cell.classList.add('other-month');
      if (dateStr === todayStr) cell.classList.add('today');
      if (dateStr === selectedDate) cell.classList.add('selected');

      const numDiv = document.createElement('div');
      numDiv.className = 'day-num';
      numDiv.textContent = dayNum;
      cell.appendChild(numDiv);

      const booksForDay = byDate[dateStr] || [];
      if (booksForDay.length > 0) {
        const pillsDiv = document.createElement('div');
        pillsDiv.className = 'day-bookings';
        const show = Math.min(booksForDay.length, 2);
        for (let j = 0; j < show; j++) {
          const b = booksForDay[j];
          const pill = document.createElement('div');
          pill.className = 'day-booking-pill ' + timePillClass(b.time);
          pill.textContent = b.name.split(' ')[0];
          pillsDiv.appendChild(pill);
        }
        if (booksForDay.length > 2) {
          const more = document.createElement('div');
          more.className = 'more-badge';
          more.textContent = `+${booksForDay.length - 2} more`;
          pillsDiv.appendChild(more);
        }
        cell.appendChild(pillsDiv);
      }

      cell.addEventListener('click', () => selectDay(dateStr));
      grid.appendChild(cell);
    }
  }

  function timePillClass(time) {
    if (!time) return 'pill-tbd';
    if (time.includes('Morning'))   return 'pill-morning';
    if (time.includes('Afternoon')) return 'pill-afternoon';
    if (time.includes('Evening'))   return 'pill-evening';
    return 'pill-tbd';
  }

  function selectDay(dateStr) {
    selectedDate = dateStr;
    document.querySelectorAll('.cal-day.selected').forEach(d => d.classList.remove('selected'));
    showDayDetail(dateStr);
    renderCalendar(); // re-render to show selection
  }

  // ── DAY DETAIL ──
  function showDayDetail(dateStr) {
    const dayBookings = allBookings.filter(b => b.date === dateStr);
    const label = dateStr ? formatDateLabel(dateStr) : 'No date';
    document.getElementById('dayDetailTitle').textContent = label;
    document.getElementById('dayDetailCount').textContent = dayBookings.length;

    const body = document.getElementById('dayDetailBody');
    if (dayBookings.length === 0) {
      body.innerHTML = `<div class="no-bookings"><span class="no-bookings-icon">📭</span>No bookings for this day.</div>`;
      return;
    }

    body.innerHTML = dayBookings.map(b => `
      <div class="booking-item" onclick="openModal('${b.id}')">
        <div class="booking-item-top">
          <div class="booking-name">${escHtml(b.name)}</div>
          <span class="time-badge ${timePillClass(b.time)}">${b.time ? b.time.split('(')[0].trim() : 'TBD'}</span>
        </div>
        <div class="booking-detail">
          ${b.phone ? `<span>📞 ${escHtml(b.phone)}</span>` : ''}
          ${b.location ? `<span>📍 ${escHtml(b.location)}</span>` : ''}
          ${b.problem ? `<span>💬 ${escHtml(b.problem.substring(0,60))}${b.problem.length>60?'…':''}</span>` : ''}
        </div>
        <div class="booking-service-tag">${escHtml(b.service || 'Service TBD')}</div>
        <div class="booking-actions">
          <button class="action-btn action-wa" onclick="event.stopPropagation();waContact('${b.phone}','${escHtml(b.name)}')">💬 WhatsApp</button>
          <button class="action-btn action-call" onclick="event.stopPropagation();callContact('${b.phone}')">📞 Call</button>
        </div>
      </div>
    `).join('');
  }

  // ── ALL BOOKINGS LIST ──
  function renderAllList() {
    const container = document.getElementById('allBookingsList');
    const sorted = [...allBookings].sort((a,b) => (b.submittedAt||'').localeCompare(a.submittedAt||''));
    document.getElementById('listCount').textContent = `${sorted.length} total`;

    if (sorted.length === 0) {
      container.innerHTML = `<div class="loading-state" style="padding:2rem">No bookings yet. They'll appear here once clients submit the form.</div>`;
      return;
    }

    container.innerHTML = sorted.map(b => `
      <div class="list-item" onclick="openModal('${b.id}')">
        <div class="list-avatar">${b.name.charAt(0).toUpperCase()}</div>
        <div>
          <div class="list-name">${escHtml(b.name)}</div>
          <div class="list-meta">${escHtml(b.service || 'Service TBD')} · ${escHtml(b.location||'')}</div>
        </div>
        <div class="list-date">${b.date ? formatDateShort(b.date) : 'TBD'}</div>
      </div>
    `).join('');
  }

  // ── MODAL ──
  function openModal(id) {
    const b = allBookings.find(x => x.id === id);
    if (!b) return;
    document.getElementById('modalName').textContent = b.name;
    document.getElementById('modalBody').innerHTML = `
      <div class="modal-row"><span class="modal-label">📞 Phone</span><span class="modal-value">${escHtml(b.phone||'—')}</span></div>
      <div class="modal-row"><span class="modal-label">🔧 Service</span><span class="modal-value">${escHtml(b.service||'—')}</span></div>
      <div class="modal-row"><span class="modal-label">📍 Location</span><span class="modal-value">${escHtml(b.location||'—')}</span></div>
      <div class="modal-row"><span class="modal-label">📆 Date</span><span class="modal-value">${b.date ? formatDateLabel(b.date) : 'TBD'}</span></div>
      <div class="modal-row"><span class="modal-label">⏰ Time</span><span class="modal-value">${escHtml(b.time||'TBD')}</span></div>
      <div class="modal-row"><span class="modal-label">💬 Problem</span><span class="modal-value">${escHtml(b.problem||'—')}</span></div>
    `;
    document.getElementById('modalWa').onclick   = () => waContact(b.phone, b.name);
    document.getElementById('modalCall').onclick = () => callContact(b.phone);
    document.getElementById('modalOverlay').classList.add('open');
  }

  function closeModal(e) {
    if (e.target === document.getElementById('modalOverlay'))
      document.getElementById('modalOverlay').classList.remove('open');
  }

  // ── CONTACT HELPERS ──
  function waContact(phone, name) {
    const num = phone.replace(/\D/g,'');
    const msg = encodeURIComponent(`Hi ${name}, this is GMCore confirming your appointment request.`);
    window.open(`https://wa.me/${num}?text=${msg}`, '_blank');
  }
  function callContact(phone) {
    const num = phone.replace(/\D/g,'');
    window.location.href = `tel:+${num}`;
  }

  // ── UTILS ──
  function formatDateLabel(str) {
    const d = new Date(str + 'T12:00:00');
    return d.toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  }
  function formatDateShort(str) {
    const d = new Date(str + 'T12:00:00');
    return d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
  }
  function escHtml(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── INIT ──
  loadBookings();
</script>
</body>
</html>
